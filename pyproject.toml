[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-benchmark"
version = "1.0.0"
description = "PRISM: Probing Reasoning, Instruction, and Source Memory in LLM Hallucinations"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["openai>=1.40", "pyyaml>=6.0", "langdetect>=1.0.9"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["prism*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
