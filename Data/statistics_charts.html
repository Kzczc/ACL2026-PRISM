<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PRISM 数据集统计</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .chart-container {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .chart {
            width: 100%;
            height: 500px;
        }
        .chart-large {
            width: 100%;
            height: 700px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
    </style>
</head>
<body>
    <h1>PRISM 数据集统计可视化</h1>
    
    <div class="chart-container">
        <div id="main-chart" class="chart"></div>
    </div>
    
    <div class="grid-container">
        <div class="chart-container">
            <div id="chart-IFE" class="chart"></div>
        </div>
        <div class="chart-container">
            <div id="chart-KE" class="chart"></div>
        </div>
        <div class="chart-container">
            <div id="chart-KM" class="chart"></div>
        </div>
        <div class="chart-container">
            <div id="chart-RE" class="chart"></div>
        </div>
    </div>
    
    <script>

        var mainChart = echarts.init(document.getElementById('main-chart'));
        var mainOption = {
            title: {
                text: 'PRISM 数据集总体分布',
                left: 'center',
                top: 20,
                textStyle: {
                    fontSize: 24,
                    fontWeight: 'bold'
                }
            },
            tooltip: {
                trigger: 'item',
                formatter: '{b}: {c} 条 ({d}%)'
            },
            legend: {
                orient: 'vertical',
                left: 'left',
                top: 'middle'
            },
            series: [{
                name: '数据分类',
                type: 'pie',
                radius: ['40%', '70%'],
                center: ['60%', '55%'],
                avoidLabelOverlap: false,
                itemStyle: {
                    borderRadius: 10,
                    borderColor: '#fff',
                    borderWidth: 2
                },
                label: {
                    show: true,
                    formatter: '{b}\n{c} 条\n{d}%',
                    fontSize: 14
                },
                emphasis: {
                    label: {
                        show: true,
                        fontSize: 16,
                        fontWeight: 'bold'
                    }
                },
                data: [
                    {value: 2442, name: "IFE (指令遵循错误)", itemStyle: {color: "#FF6B6B"}},
                    {value: 8343, name: "KE (知识错误)", itemStyle: {color: "#4ECDC4"}},
                    {value: 2078, name: "KM (知识缺失)", itemStyle: {color: "#45B7D1"}},
                    {value: 5138, name: "RE (推理错误)", itemStyle: {color: "#FFA07A"}},
                ]
            }]
        };
        mainChart.setOption(mainOption);

        var chartIFE = echarts.init(document.getElementById('chart-IFE'));
        var optionIFE = {
            title: {
                text: 'IFE - 指令遵循错误',
                subtext: '总计: 2442 条',
                left: 'center',
                textStyle: {
                    fontSize: 18,
                    fontWeight: 'bold'
                }
            },
            tooltip: {
                trigger: 'item',
                formatter: '{b}: {c} 条 ({d}%)'
            },
            series: [{
                name: 'IFE',
                type: 'pie',
                radius: '65%',
                center: ['50%', '55%'],
                data: [
                    {value: 408, name: "IFE1_format"},
                    {value: 616, name: "IFE2_length"},
                    {value: 614, name: "IFE3_language"},
                    {value: 804, name: "IFE4_complex"},
                ],
                emphasis: {
                    itemStyle: {
                        shadowBlur: 10,
                        shadowOffsetX: 0,
                        shadowColor: 'rgba(0, 0, 0, 0.5)'
                    }
                }
            }]
        };
        chartIFE.setOption(optionIFE);

        var chartKE = echarts.init(document.getElementById('chart-KE'));
        var optionKE = {
            title: {
                text: 'KE - 知识错误',
                subtext: '总计: 8343 条',
                left: 'center',
                textStyle: {
                    fontSize: 18,
                    fontWeight: 'bold'
                }
            },
            tooltip: {
                trigger: 'item',
                formatter: '{b}: {c} 条 ({d}%)'
            },
            series: [{
                name: 'KE',
                type: 'pie',
                radius: '65%',
                center: ['50%', '55%'],
                data: [
                    {value: 1717, name: "KE1_truth"},
                    {value: 4158, name: "KE2_conflict"},
                    {value: 2468, name: "KE3_confuse"},
                ],
                emphasis: {
                    itemStyle: {
                        shadowBlur: 10,
                        shadowOffsetX: 0,
                        shadowColor: 'rgba(0, 0, 0, 0.5)'
                    }
                }
            }]
        };
        chartKE.setOption(optionKE);

        var chartKM = echarts.init(document.getElementById('chart-KM'));
        var optionKM = {
            title: {
                text: 'KM - 知识缺失',
                subtext: '总计: 1542 条',
                left: 'center',
                textStyle: {
                    fontSize: 18,
                    fontWeight: 'bold'
                }
            },
            tooltip: {
                trigger: 'item',
                formatter: '{b}: {c} 条 ({d}%)'
            },
            series: [{
                name: 'KM',
                type: 'pie',
                radius: '65%',
                center: ['50%', '55%'],
                data: [
                    {value: 857, name: "KM_DSK"},
                    {value: 410, name: "KM_FK"},
                    {value: 275, name: "KM_TK"},
                ],
                emphasis: {
                    itemStyle: {
                        shadowBlur: 10,
                        shadowOffsetX: 0,
                        shadowColor: 'rgba(0, 0, 0, 0.5)'
                    }
                }
            }]
        };
        chartKM.setOption(optionKM);

        var chartRE = echarts.init(document.getElementById('chart-RE'));
        var optionRE = {
            title: {
                text: 'RE - 推理错误',
                subtext: '总计: 5138 条',
                left: 'center',
                textStyle: {
                    fontSize: 18,
                    fontWeight: 'bold'
                }
            },
            tooltip: {
                trigger: 'item',
                formatter: '{b}: {c} 条 ({d}%)'
            },
            series: [{
                name: 'RE',
                type: 'pie',
                radius: '65%',
                center: ['50%', '55%'],
                data: [
                    {value: 1090, name: "RE1"},
                    {value: 773, name: "RE2"},
                    {value: 1916, name: "RE3"},
                    {value: 1359, name: "RE4"},
                ],
                emphasis: {
                    itemStyle: {
                        shadowBlur: 10,
                        shadowOffsetX: 0,
                        shadowColor: 'rgba(0, 0, 0, 0.5)'
                    }
                }
            }]
        };
        chartRE.setOption(optionRE);

        window.addEventListener('resize', function() {
            mainChart.resize();
            chartIFE.resize();
            chartKE.resize();
            chartKM.resize();
            chartRE.resize();
        });
    </script>
</body>
</html>
